<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium E-commerce Store</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Montserrat', sans-serif;
    margin: 0; padding: 0;
    background: linear-gradient(135deg, #FDEBD0, #FAD7A0);
    scroll-behavior: smooth;
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    z-index: 1000;
  }
  header h1 { color: #C47E2C; margin: 0; font-size: 24px; }
  nav a {
    margin-left: 20px; text-decoration: none; color: #333; font-weight: 600;
    transition: color 0.3s;
  }
  nav a:hover { color: #C47E2C; }

  /* Category Filter */
  .filters { text-align: center; margin: 20px 0; }
  .filters button {
    background: #fff; border: 1px solid #C47E2C; color: #C47E2C;
    padding: 10px 15px; margin: 5px; border-radius: 12px;
    cursor: pointer; transition: all 0.3s;
  }
  .filters button:hover, .filters button.active {
    background: #C47E2C; color: #fff;
  }

  /* Product Cards */
  .products {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    padding: 20px;
  }
  .product-card {
    background: #fff; border-radius: 16px; width: 260px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden; position: relative;
  }
  .product-card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }

  /* Product Slider */
  .slider {
    position: relative; overflow: hidden; width: 100%; height: 200px;
  }
  .slider img {
    width: 100%; height: 200px; object-fit: cover;
    transition: transform 0.5s ease;
  }

  .product-card h3 { margin: 15px; color: #333; font-weight: 600; }
  .product-card p { margin: 0 15px 10px; color: #555; font-weight: 500; }
  .product-card button {
    background: linear-gradient(45deg, #C47E2C, #F39C12);
    color: #fff; border: none; width: calc(100% - 30px);
    margin: 10px 15px 20px; padding: 12px; border-radius: 12px;
    font-size: 16px; cursor: pointer; transition: all 0.3s ease;
  }
  .product-card button:hover {
    background: linear-gradient(45deg, #A3611F, #D35400);
    transform: scale(1.05);
  }

  /* Modal */
  .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.7);
    justify-content: center; align-items: center; backdrop-filter: blur(5px);
  }
  .modal-content {
    background: #fff; padding: 30px 25px; border-radius: 20px;
    width: 90%; max-width: 450px; position: relative;
    animation: slideIn 0.3s ease;
  }
  .close { position: absolute; top: 15px; right: 20px; font-size: 26px; font-weight: bold; cursor: pointer; color: #C47E2C; }

  label { display: block; margin-top: 15px; color: #333; font-weight: 500; }
  input, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: 1px solid #ccc; font-size: 15px; }
  button#submitOrder { background: linear-gradient(45deg, #C47E2C, #F39C12); color: #fff; margin-top: 20px; width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; cursor: pointer; transition: all 0.3s ease; }
  button#submitOrder:hover { background: linear-gradient(45deg, #A3611F, #D35400); transform: scale(1.05); }

  @keyframes slideIn { from {transform: translateY(-30px); opacity:0;} to {transform: translateY(0); opacity:1;} }

  @media(max-width: 600px){ .products { flex-direction: column; align-items: center; } }
</style>
</head>
<body>

<header>
  <h1>Adler's Shop</h1>
  <nav>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<div class="filters">
  <button class="filterBtn active" data-category="all">All</button>
  <button class="filterBtn" data-category="cat1">Category 1</button>
  <button class="filterBtn" data-category="cat2">Category 2</button>
</div>

<div id="products" class="products">
  <div class="product-card" data-category="cat1" data-product="Product 1">
    <div class="slider">
      <img src="https://via.placeholder.com/260x200?text=1a" alt="">
      <img src="https://via.placeholder.com/260x200?text=1b" alt="">
    </div>
    <h3>Product 1</h3>
    <p>₵65</p>
    <button class="orderBtn">Order Now</button>
  </div>
  <div class="product-card" data-category="cat2" data-product="Product 2">
    <div class="slider">
      <img src="https://via.placeholder.com/260x200?text=2a" alt="">
      <img src="https://via.placeholder.com/260x200?text=2b" alt="">
    </div>
    <h3>Product 2</h3>
    <p>₵120</p>
    <button class="orderBtn">Order Now</button>
  </div>
</div>

<!-- Modal -->
<div id="orderModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2 style="color:#C47E2C;">Place Your Order</h2>
    <form id="orderForm">
      <label>Name:</label>
      <input type="text" id="name" required>
      <label>WhatsApp Number:</label>
      <input type="tel" id="whatsapp" required placeholder="+260...">
      <label>Quantity:</label>
      <input type="number" id="quantity" min="1" value="1">
      <label>Message (optional):</label>
      <textarea id="message" placeholder="Any notes"></textarea>
      <button type="submit" id="submitOrder">Send Order via WhatsApp</button>
    </form>
  </div>
</div>

<script>
// Modal
const modal = document.getElementById("orderModal");
const closeModal = document.querySelector(".close");
const orderBtns = document.querySelectorAll(".orderBtn");
let selectedProduct = "";

orderBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    selectedProduct = btn.parentElement.dataset.product;
    modal.style.display = "flex";
  });
});
closeModal.onclick = () => modal.style.display = "none";
window.onclick = (e) => { if(e.target == modal) modal.style.display = "none"; }

// WhatsApp Order
document.getElementById("orderForm").addEventListener("submit", function(e){
  e.preventDefault();
  const name = document.getElementById("name").value;
  const whatsapp = document.getElementById("whatsapp").value;
  const quantity = document.getElementById("quantity").value;
  const message = document.getElementById("message").value;
  const text = `New Order:%0AProduct: ${selectedProduct}%0AQuantity: ${quantity}%0AName: ${name}%0AWhatsApp: ${whatsapp}%0AMessage: ${message}`;
  window.open(`https://wa.me/YOUR_WHATSAPP_NUMBER?text=${text}`, "_blank");
  modal.style.display = "none";
});

// Filter
const filterBtns = document.querySelectorAll(".filterBtn");
const productCards = document.querySelectorAll(".product-card");

filterBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    filterBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const cat = btn.dataset.category;
    productCards.forEach(card => {
      if(cat === "all" || card.dataset.category === cat){
        card.style.display = "block";
      } else { card.style.display = "none"; }
    });
  });
});

// Slider
document.querySelectorAll('.slider').forEach(slider => {
  const imgs = slider.querySelectorAll('img');
  let index = 0;
  setInterval(() => {
    imgs.forEach((img,i)=> img.style.transform = `translateX(-${index*100}%)`);
    index = (index+1)%imgs.length;
  }, 2500);
});
</script>

</body>
</html>
